name: Build CoinCore

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract CoinCore
        run: |
          unzip "CoinCore-1.0.1-complete.zip" -d extracted

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: extracted/CoinCore-1.0.1-complete/source/pom.xml

      - name: Build CoinCore
        working-directory: extracted/CoinCore-1.0.1-complete/source
        run: mvn clean package

      - name: Show generated JAR
        run: |
          echo "Generated JAR files:"
          find extracted -type f -name "*.jar"

      - name: Upload CoinCore JAR
        uses: actions/upload-artifact@v4
        with:
          name: CoinCore
          path: extracted/CoinCore-1.0.1-complete/source/target/*.jar
          if-no-files-found: error
